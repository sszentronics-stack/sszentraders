# Aura Beauty Care — Supabase local/remote config
# https://supabase.com/docs/guides/cli/config

project_id = "jooukhdxxllutkdqznqt"

[api]
enabled = true

[db]
port = 54322

[studio]
enabled = true

# Shared import map so bare "zod" resolves during remote deploy bundling.
# Publishable API keys are not JWTs — gateway JWT verify must be off;
# Auth is enforced inside each function instead.
[functions.auth]
verify_jwt = false
import_map = "./functions/import_map.json"

